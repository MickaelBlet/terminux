# Terminux configuration. Edits are applied live.
default_profile = "shell"
font_size = 14
scrollback = 100000
tab_position = "top"
tab_switcher_mode = "mru"
toolbar = ["duplicate_pane_right", "duplicate_pane_down", "toggle_pane_zoom", "find", "separator", "open_settings"]

[defaults]
color_scheme = "Terminux"
font = { face = "JetBrains Mono", size = 14 }
cursor_shape = "bar"
padding = 8

[[profile]]
id = "dev"
name = "Dev server"
cmd = "npm"
args = ["run", "dev"]
icon = "power"
tab_color = "#d97757"

[[profile]]
id = "python"
name = "Python"
cmd = "python3"
icon = "command"

[[action]]
id = "user.git_status"
name = "Git status"
command = "send_input"
input = "git status\r"

[keys]
find = "F3"
