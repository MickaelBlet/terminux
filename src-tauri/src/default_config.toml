# Terminux configuration. Edits are applied live.
# Ctrl+Space completes keys and values; unknown keys are underlined.

default_profile = "shell"
font_size = 14
# font_family = "'JetBrains Mono', 'Symbols Nerd Font Mono', 'Noto Sans Symbols 2', 'Noto Sans Math', monospace"
# Color emoji font, tried before the bundled Twemoji (default: the system one: Segoe UI Emoji / Apple Color Emoji / Noto Color Emoji).
# emoji_font = "Segoe UI Emoji"
scrollback = 100000
# renderer = "canvas"   # "webgl" | "canvas" | "dom" (default: canvas on Linux, webgl elsewhere)
# Notify (desktop) on OSC 9 / OSC 777 or bell when the window is not focused.
notifications = true

# --- Appearance ---
# app_theme = "dark"             # "dark" | "light" | "system" | name of a [[ui_theme]]
# tab_width_mode = "equal"       # "equal" | "title_length" | "compact"
# tab_position = "top"           # "top" | "left" | "right" (vertical tabs)
# vertical_tab_width = 200       # initial width of the vertical tab panel (px)
# vertical_tabs_collapsed = false
# new_tab_position = "after_last_tab"   # or "after_current_tab"
# tab_switcher_mode = "in_order" # "mru" | "in_order" | "disabled" (Ctrl+Tab overlay)
# show_tabs_fullscreen = false
show_zoom_badge = false          # ZOOM badge on a zoomed pane
# show_pane_title_bar = "never"  # "never" | "multiple" (split tabs only) | "always"
# show_terminal_title_in_titlebar = true
# Title-bar buttons: command names, [[action]] ids or "separator". Toolbar edits in the UI (right-click, drag) are saved here.
# toolbar = ["duplicate_pane_right", "duplicate_pane_down", "toggle_pane_zoom", "find", "separator", "open_settings"]
# always_on_top = false
# disable_animations = false
# confirm_close_all_tabs = true

# --- Startup ---
# launch_mode = "default"        # "default" | "maximized" | "fullscreen" | "focus" | "maximized_focus"
# initial_cols = 120
# initial_rows = 30
# initial_position = "100,100"   # "x,y", "x," or ",y"
# center_on_launch = false
# first_window_preference = "persisted_window_layout"   # restore the last session; "default_profile" to start fresh
# windowing_behavior = "use_new" # "use_new" | "use_existing" | "use_any_existing" (when launched again)
# startup_actions = "new-tab -p shell ; split-pane -H -p python"
# start_on_user_login = false
# allow_headless = false         # keep running (tray, quake mode) after the last window closes
# disabled_profile_sources = ["ssh"]   # generated profiles: "wsl", "ssh", "powershell", "windows"

# --- Interaction ---
# Copy the selection to the clipboard on mouse release.
copy_on_select = false
# Show a "Copied to clipboard" toast when the selection is copied.
# copy_feedback = true
# Let programs (vim, tmux, ssh…) set the clipboard with OSC 52. Off by default: any output,
# e.g. a cat'ed file, could otherwise replace what you paste next.
# osc52_clipboard = false
# copy_formatting = false        # also copy colors as HTML: true | false | "html"
# trim_block_selection = true
# trim_paste = true
# Paste the clipboard on middle / right click (Shift+click when an app grabs the mouse).
middle_click_paste = true
right_click_paste = true
# right_click_context_menu = false   # right click opens the menu instead of pasting
# Characters that delimit a word on double-click selection.
# word_separators = " ()[]{}',\"`"
# focus_follow_mouse = false
# scroll_to_zoom = true              # Ctrl+wheel changes the font size
# scroll_to_change_opacity = true    # Ctrl+Shift+wheel changes the opacity
# detect_urls = true
# detect_file_paths = true          # Ctrl+click a file path to open it in an editor
# file_link_editor = "code --goto {file}:{line}:{col}"   # unset: $VISUAL/$EDITOR in a new tab
# file_link_open = "builtin"         # builtin (editor tab in Terminux) | external | tab | pane
# ssh_follow_directory = true       # split/duplicate of an ssh pane reconnects in the remote dir
# large_paste_warning = true
# multi_line_paste_warning = true
# search_web_url = "https://www.bing.com/search?q=%s"
# minimize_to_tray = false
# always_show_tray_icon = false
# auto_hide_window = false

# Settings applied to every profile; any of them can also be set per [[profile]].
[defaults]
# color_scheme = "Terminux"      # name, or { light = "One Half Light", dark = "One Half Dark" }
# font = { face = "JetBrains Mono", size = 14, weight = "normal", cell_height = 1.0, cell_width = 0, ligatures = false }
# cursor_shape = "filled_box"    # "bar" | "vintage" | "underscore" | "filled_box" | "empty_box" | "double_underscore"
# cursor_color = "#34d399"
# foreground = "#d6d9e0"
# background = "#14161b"
# selection_background = "#3a4256"
# intense_text_style = "bold"    # "none" | "bold" | "bright" | "all"
# adjust_indistinguishable_colors = "never"   # "never" | "indexed" | "always"
# padding = "6, 4, 2, 2"         # "all" | "horizontal, vertical" | "left, top, right, bottom"
# scrollbar_state = "visible"    # "visible" | "hidden" | "always"
# opacity = 100                  # 0-100; below 100 needs a restart the first time
# use_acrylic = false            # blurred transparency (Windows / macOS)
# background_image = "~/Pictures/bg.png"
# background_image_stretch_mode = "uniform_to_fill"   # "none" | "fill" | "uniform" | "uniform_to_fill"
# background_image_alignment = "center"
# background_image_opacity = 1.0
# retro_terminal_effect = false
# unfocused_appearance = { opacity = 90 }
# history_size = 10000
# snap_on_input = true
# close_on_exit = "automatic"    # "automatic" | "graceful" | "always" | "never"
# startup_timeout = 15           # restart a new shell silent for this many seconds (0 = off)
# startup_retries = 2            # automatic restarts on spawn failure / silent startup
# bell_style = "none"            # "audible" | "window" | "taskbar" | "all" | "none", or a list
# bell_sound = "~/sounds/bell.wav"
# auto_mark_prompts = false
# show_marks_on_scrollbar = false
# path_translation_style = "none"   # dropped files: "none" | "wsl" | "cygwin" | "msys2" | "mingw"

# Profiles: id, name, cmd + args (or commandline), cwd, env, os ("linux" | "windows" | "macos"),
# login_shell, hidden, icon, tab_title, suppress_application_title, tab_color.
# "$SHELL" means the user's default shell. Non-shell commands run through the
# login shell on Unix so PATH from your rc files (nvm, ~/.local/bin, ...) applies.

# Example using every profile option (any [defaults] setting is also accepted here).
# [[profile]]
# id = "example"
# name = "Example"
# cmd = "bash"                   # "$SHELL" = user's default shell
# args = ["-l"]
# # commandline = "bash -l"      # alternative to cmd + args
# cwd = "~/work"                 # alias: starting_directory
# env = { EDITOR = "vim", LANG = "en_US.UTF-8" }
# os = "linux"                   # "linux" | "windows" | "macos"
# login_shell = true             # run through the login shell (Unix)
# hidden = false
# icon = "terminal"              # emoji, image path or built-in name
# tab_title = "Work"
# suppress_application_title = false
# tab_color = "#34d399"
# color_scheme = "One Half Dark" # or { light = "One Half Light", dark = "One Half Dark" }
# font = { face = "JetBrains Mono", size = 14, weight = "normal", cell_height = 1.0, cell_width = 0, ligatures = false, features = { ss01 = 1 }, axes = { wght = 450 } }
# cursor_shape = "bar"
# cursor_color = "#34d399"
# foreground = "#d6d9e0"
# background = "#14161b"
# selection_background = "#3a4256"
# intense_text_style = "bold"
# adjust_indistinguishable_colors = "never"
# padding = "6, 4"
# scrollbar_state = "visible"
# opacity = 100
# use_acrylic = false
# background_image = "~/Pictures/bg.png"
# background_image_stretch_mode = "uniform_to_fill"
# background_image_alignment = "center"
# background_image_opacity = 1.0
# retro_terminal_effect = false
# unfocused_appearance = { opacity = 90 }
# history_size = 10000
# snap_on_input = true
# close_on_exit = "automatic"
# startup_timeout = 15
# startup_retries = 2
# bell_style = "none"
# bell_sound = "~/sounds/bell.wav"
# auto_mark_prompts = false
# show_marks_on_scrollbar = false
# right_click_context_menu = false
# reposition_cursor_with_mouse = false
# path_translation_style = "none"

[[profile]]
id = "shell"
name = "Shell"
cmd = "$SHELL"

[[profile]]
id = "wsl"
name = "WSL"
cmd = "wsl.exe"
os = "windows"

# Color schemes. Built in: Terminux, Campbell, Campbell Powershell, Vintage, One Half Dark,
# One Half Light, Solarized Dark, Solarized Light, Tango Dark, Tango Light, Dark+,
# VSCode Dark Modern, VSCode Light Modern, CGA, IBM 5153, Ottosson, Dimidium.
